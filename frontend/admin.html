<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="VisiSign — admin console" />
  <meta name="color-scheme" content="light dark" />
  <title>VisiSign — Admin</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <!-- Top bar (admin console) -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">VS</span>
      <span class="brand-name">VisiSign<span class="brand-suffix muted" style="font-weight:600">&nbsp;Admin</span></span>
    </a>
    <nav class="topnav">
      <a href="index.html">← Reservations</a>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Theme">🌓</button>
      <span class="session" id="session"></span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="scripts/api.js" defer></script>
  <script src="scripts/store.js" defer></script>
  <script src="scripts/branding.js" defer></script>
  <script src="scripts/ui.js" defer></script>
  <script src="scripts/admin-settings.js" defer></script>
  <script src="scripts/admin.js" defer></script>
</body>
</html>
